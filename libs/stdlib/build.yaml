project:
  name: "utopia"
  version: "0.1.0"

build:
  target: library
  output_dir: "build/lib"
  include_dirs:
    - "."
  sources:
    - "lib/memory.utp"
    - "lib/ffi.utp"
    - "lib/io.utp"
    - "lib/math.utp"
    - "lib/limits.utp"
    - "lib/system.utp"
    - "lib/time.utp"
    - "lib/random.utp"
    - "lib/utility.utp"
    - "lib/collections.utp"
    - "lib/simd.utp"
  linker_flags:
    - "-ldl"
    - "-lm"